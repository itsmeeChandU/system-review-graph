[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "system-review-graph"
version = "0.1.0"
description = "Generate system-level review graphs: what a repo actually does, not just what code exists."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "System Review Graph contributors" }
]
keywords = [
  "architecture",
  "audit",
  "code-review",
  "system-design",
  "software-architecture",
  "documentation",
  "reverse-engineering"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance"
]

[project.urls]
Homepage = "https://github.com/itsmeeChandU/system-review-graph"
Repository = "https://github.com/itsmeeChandU/system-review-graph"
Issues = "https://github.com/itsmeeChandU/system-review-graph/issues"

[project.scripts]
system-review-graph = "system_review_graph.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
